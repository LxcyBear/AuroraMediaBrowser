name: Build ZIP compatibility bundles
on:
  push:
    branches: [main]
    paths:
      - 'repo/Skins/**'
      - '.github/tools/build_zip_bundles.py'
      - '.github/workflows/build-zip-bundles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install 7z
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq p7zip-full
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare ZIP compatibility bundles
        run: python .github/tools/build_zip_bundles.py
      - name: Commit compatibility bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A repo/.bundles
          if ! git diff --cached --quiet; then
            git commit -m "Build Aurora-compatible 7z bundles from ZIP skins"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
